<title>אשד ומאיה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap">
<style>
  @font-face {
    font-family: "MayaFont";
    src: url("mayafont.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    direction: rtl;

    /* the invitation: cream paper, sage, deep green ink */
    --paper:     #F7F4EC;
    --paper-up:  #FFFDF8;
    --ink:       #2F5D3F;
    --ink-soft:  #6B7F6C;
    --sage:      #9DB38F;
    --sage-deep: #7A9570;

    --sp-2: 12px;
    --sp-3: 22px;
    --sp-4: 34px;
    --sp-5: 48px;
  }

  html { height: 100%; }

  body {
    margin: 0;
    box-sizing: border-box;
    min-height: 100vh;
    min-height: 100svh;
    padding-block: var(--sp-4);
    padding-inline: 22px;
    background: var(--paper) url("bg.webp") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: "Assistant", system-ui, sans-serif;
    font-weight: 400;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  @supports (-webkit-touch-callout: none) {
    body { background-attachment: scroll; }
  }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }
  .sheet::before {
    content: "";
    position: absolute;
    inset: -56px -44px;
    z-index: -1;
    border-radius: 48%;
    background: radial-gradient(ellipse 78% 74% at 50% 50%, rgba(247,244,236,.96) 0, rgba(247,244,236,.9) 52%, rgba(247,244,236,.55) 78%, rgba(247,244,236,0) 100%);
  }

  .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
  .rise-2 { animation-delay: .1s; }

  @keyframes rise {
    from { opacity: .001; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .masthead h1 {
    margin: 0;
    font-family: "MayaFont", "Assistant", sans-serif;
    font-size: clamp(54px, 16vw, 84px);
    font-weight: 400;
    line-height: 1;
    text-wrap: balance;
  }

  .masthead p {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }

  /* ---------- steps ---------- */

  .step { display: flex; flex-direction: column; gap: var(--sp-3); }
  .step[hidden] { display: none; }

  .prompt {
    margin: 0;
    font-family: "MayaFont", "Assistant", sans-serif;
    font-size: clamp(28px, 7.6vw, 38px);
    font-weight: 400;
    line-height: 1.2;
    text-align: center;
    text-wrap: balance;
  }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); align-items: end; }

  /* ---------- who ---------- */

  .who {
    appearance: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    border-radius: 24px;
    transition: transform .3s cubic-bezier(.2,.7,.3,1);
  }

  .who .portrait {
    width: 100%;
    max-width: 210px;
    height: auto;
    display: block;
    filter: drop-shadow(0 10px 18px rgba(47,93,63,.14));
    transition: filter .3s ease;
  }

  .who .name {
    display: inline-block;
    font-family: "MayaFont", "Assistant", sans-serif;
    font-size: clamp(34px, 9.5vw, 44px);
    line-height: 1;
    transition: color .25s ease;
  }

  .who:hover,
  .who:focus-visible { transform: translateY(-6px); outline: none; }
  .who:hover .portrait,
  .who:focus-visible .portrait { filter: drop-shadow(0 18px 26px rgba(47,93,63,.22)); }
  .who:hover .name,
  .who:focus-visible .name { color: var(--sage-deep); }
  .who:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 8px; }

  .nudge { display: flex; justify-content: center; color: var(--sage-deep); }
  .nudge .arrow { height: 54px; width: auto; display: block; }
  .nudge-b .arrow { transform: scaleX(-1); }

  /* ---------- how ---------- */

  .chosen { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .flyer { position: fixed; z-index: 20; pointer-events: none; will-change: transform; transform-origin: 0 0; }

  .thanks {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    align-content: center;
    justify-items: center;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(247,244,236,.95) 0, rgba(247,244,236,.8) 26%, rgba(247,244,236,0) 58%);
    animation: thanks-out .5s ease 2.2s both;
  }
  .thanks .heart { width: 110px; height: 110px; color: var(--ink); overflow: visible; }
  .thanks .heart path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s cubic-bezier(.4,0,.3,1) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .thanks .word {
    margin-block-start: 6px;
    font-family: "MayaFont", "Assistant", sans-serif;
    font-size: 40px;
    color: var(--ink);
    animation: rise .6s ease .6s both;
  }
  @keyframes thanks-out { to { opacity: 0; } }
  .chosen .portrait { width: 120px; height: auto; display: block; }

  .chosen .line { display: inline-block; font-size: 14px; letter-spacing: 0.06em; color: var(--ink-soft); }

  .chosen .line b {
    font-family: "MayaFont", "Assistant", sans-serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink);
    vertical-align: -3px;
  }

  .pay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 120px;
    padding: var(--sp-3) var(--sp-2);
    border: 1.5px solid var(--sage);
    border-radius: 24px;
    background: rgba(255,253,248,.88);
    color: inherit;
    text-decoration: none;
    box-shadow: 0 10px 24px -18px rgba(47,93,63,.5);
    transition: border-color .25s ease, transform .25s cubic-bezier(.2,.7,.3,1), background .25s ease;
  }

  .pay:hover,
  .pay:focus-visible {
    border-color: var(--ink);
    background: var(--paper-up);
    transform: translateY(-5px);
  }

  .pay:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  .pay .logo { width: auto; height: auto; max-height: 46px; max-width: 82%; display: block; }



  .back {
    align-self: center;
    appearance: none;
    border: 0;
    background: none;
    cursor: pointer;
    padding: 8px 12px;
    font-family: "Assistant", sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 5px;
    border-radius: 10px;
  }

  .back:hover, .back:focus-visible { color: var(--ink); outline: none; }
  .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- opening: a painted envelope opens, the card slides out and melts into the page ---------- */

  .intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 24px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    background: radial-gradient(circle at 50% 50%, rgba(247,244,236,.94) 0, rgba(247,244,236,.6) 34%, rgba(247,244,236,0) 64%);
    animation: intro-out .8s ease 3.75s both;
  }
  .stage {
    position: relative;
    width: min(82vw, 330px);
    aspect-ratio: 1536 / 1024;
    animation: env-in 1s cubic-bezier(.2,.8,.2,1.06) both;
  }
  .stage .env { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 22px 30px rgba(47,93,63,.22)); }
  .stage .env-open { opacity: 0; animation: fade-in .9s ease 1.15s both; }
  .card {
    position: absolute; left: 19%; right: 19%; top: 30%; height: 46%;
    border-radius: 6px;
    background: #FFFDF8;
    border: 1px solid var(--sage);
    box-shadow: 0 10px 22px -12px rgba(47,93,63,.45);
    display: grid; place-items: center; align-content: center; gap: 2px;
    animation: card-up 1.5s cubic-bezier(.2,.9,.2,1) 2s both, card-away .8s ease-in 3.45s forwards;
  }
  .card .ct { font-family: "MayaFont", "Assistant", sans-serif; font-size: clamp(22px, 7.4vw, 30px); color: var(--ink); line-height: 1; }
  .card .ch { width: 18px; height: 18px; color: var(--ink); }
  .sparks span {
    position: absolute; left: 50%; top: 56%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: var(--sage-deep);
    opacity: 0;
    animation: spark 1.4s ease-out 1.3s both;
  }
  .sparks span:nth-child(1) { --a: -20deg; }  .sparks span:nth-child(2) { --a: 25deg; }
  .sparks span:nth-child(3) { --a: -60deg; }  .sparks span:nth-child(4) { --a: 60deg; }
  .sparks span:nth-child(5) { --a: -95deg; width: 4px; height: 4px; }
  .sparks span:nth-child(6) { --a: 100deg; width: 4px; height: 4px; }
  .sparks span:nth-child(7) { --a: 5deg; width: 4px; height: 4px; animation-delay: 1.45s; }
  .sparks span:nth-child(8) { --a: -40deg; width: 3px; height: 3px; animation-delay: 1.55s; }

  @keyframes env-in    { from { opacity: 0; transform: translateY(34px) scale(.84); } to { opacity: 1; transform: none; } }
  @keyframes fade-in   { to { opacity: 1; } }
  @keyframes card-up   { from { transform: translateY(0); } to { transform: translateY(-135%); } }
  @keyframes card-away { from { transform: translateY(-135%) scale(1); opacity: 1; } to { transform: translateY(-165%) scale(1.14); opacity: 0; } }
  @keyframes spark     { 0% { opacity: 0; transform: rotate(var(--a)) translateY(0) scale(.5); } 25% { opacity: .95; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-84px) scale(1); } }
  @keyframes intro-out { to { opacity: 0; visibility: hidden; } }

  body.has-intro .rise { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    .intro { display: none; }
    body.has-intro .rise { animation-play-state: running; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
    .who, .who .portrait, .pay { transition: none; }
    .who:hover, .who:focus-visible, .pay:hover, .pay:focus-visible { transform: none; }
  }
</style>

<div class="intro" id="intro" aria-hidden="true">
  <div class="stage">
    <div class="card">
      <span class="ct">אשד ומאיה</span>
      <svg class="ch" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M50 88C32 72 10 56 12 34c2 -16 20 -22 32 -10 3 3 5 7 6 10 2 -4 5 -8 9 -11 14 -10 30 -1 29 15 -1 20 -22 38 -36 52"/></svg>
    </div>
    <img class="env env-closed" src="env-closed.webp" alt="">
    <img class="env env-open" src="env-open.webp" alt="">
    <div class="sparks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>

<div class="sheet">

  <header class="masthead rise">
    <h1>אשד ומאיה</h1>
    <p>רגע לפני שאנחנו מאחדים חשבונות</p>
  </header>

  <!-- step 1 -->
  <section class="step rise rise-2" id="step-who">
    <h2 class="prompt">למי תרצו להעביר את המתנה</h2>

    <div class="pair">
      <div class="nudge nudge-a">
        <svg class="arrow" viewBox="0 0 40 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M31 5C37 24 27 40 13 52"/>
          <path d="M9 43l4 9 9 -1"/>
        </svg>
      </div>
      <div class="nudge nudge-b">
        <svg class="arrow" viewBox="0 0 40 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M31 5C37 24 27 40 13 52"/>
          <path d="M9 43l4 9 9 -1"/>
        </svg>
      </div>

      <button class="who" type="button" id="who-eshed" data-who="eshed">
        <img class="portrait" src="eshed.webp" alt="" >
        <span class="name">אשד</span>
      </button>

      <button class="who" type="button" id="who-maya" data-who="maya">
        <img class="portrait" src="maya.webp" alt="" >
        <span class="name">מאיה</span>
      </button>
    </div>
  </section>

  <!-- step 2 -->
  <section class="step" id="step-how" hidden>
    <div class="chosen">
      <span id="chosen-portrait"></span>
      <span class="line">המתנה בדרך אל <b id="chosen-name"></b></span>
    </div>

    <h2 class="prompt">איך תעדיפו להעביר</h2>

    <div class="pair">
      <a class="pay" id="pay-bit" href="#" target="_blank" rel="noopener">
        <img class="logo" src="bit.webp" alt="bit" style="max-height:40px">
      </a>

      <a class="pay" id="pay-paybox" href="#" target="_blank" rel="noopener">
        <img class="logo" src="paybox.webp" alt="PayBox">
      </a>
    </div>

    <button class="back" type="button" id="back">חזרה לבחירה</button>
  </section>
</div>

<script>
  // ponytail: two links per person, hardcoded for a one-off page
  const LINKS = {
    eshed: { bit: "REPLACE_ESHED_BIT", paybox: "REPLACE_ESHED_PAYBOX" },
    maya:  { bit: "REPLACE_MAYA_BIT",  paybox: "REPLACE_MAYA_PAYBOX"  },
  };
  const NAMES = { eshed: "אשד", maya: "מאיה" };

  const stepWho = document.getElementById("step-who");
  const stepHow = document.getElementById("step-how");
  const chosenName = document.getElementById("chosen-name");
  const chosenPortrait = document.getElementById("chosen-portrait");
  const payBit = document.getElementById("pay-bit");
  const payPaybox = document.getElementById("pay-paybox");

  // a link nobody filled in yet must not navigate
  function setPay(el, href) {
    const ready = href && !href.startsWith("REPLACE_");
    el.href = ready ? href : "#";
    el.onclick = (e) => { if (!ready) e.preventDefault(); sayThanks(); };
  }

  // a small heart after the tap, while the app opens
  function sayThanks() {
    if (document.querySelector(".thanks")) return;
    chime();
    const el = document.createElement("div");
    el.className = "thanks";
    el.innerHTML = '<svg class="heart" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M50 88C32 72 10 56 12 34c2 -16 20 -22 32 -10 3 3 5 7 6 10 2 -4 5 -8 9 -11 14 -10 30 -1 29 15 -1 20 -22 38 -36 52"/></svg><div class="word">תודה</div>';
    document.body.append(el);
    el.addEventListener("animationend", (e) => { if (e.animationName === "thanks-out") el.remove(); });
  }

  const masthead = document.querySelector(".masthead");
  const EASE = "cubic-bezier(.2,.7,.3,1)";
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  for (const btn of document.querySelectorAll(".who")) {
    btn.addEventListener("click", async () => {
      const who = btn.dataset.who;
      pluck();
      const src = btn.querySelector(".portrait");
      chosenName.textContent = NAMES[who];
      const target = src.cloneNode(true);
      chosenPortrait.replaceChildren(target);
      setPay(payBit, LINKS[who].bit);
      setPay(payPaybox, LINKS[who].paybox);

      if (reduced()) { stepWho.hidden = true; stepHow.hidden = false; return; }

      // 1. the chosen portrait lifts off; the rest of the first screen fades
      const from = src.getBoundingClientRect();
      const headFrom = masthead.getBoundingClientRect();
      const flyer = src.cloneNode(true);
      flyer.className = "flyer";
      Object.assign(flyer.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: "auto" });
      document.body.append(flyer);
      src.style.visibility = "hidden";
      await stepWho.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: "ease-out", fill: "forwards" }).finished;

      // 2. swap screens underneath, then glide everything to its new place
      stepWho.hidden = true;
      stepHow.hidden = false;
      const to = target.getBoundingClientRect();
      const headTo = masthead.getBoundingClientRect();
      target.style.visibility = "hidden";
      const dh = headFrom.top - headTo.top;
      if (dh) masthead.animate([{ transform: `translateY(${dh}px)` }, { transform: "none" }], { duration: 600, easing: EASE });
      for (const el of [stepHow.querySelector(".chosen .line"), ...[...stepHow.children].filter(e => !e.classList.contains("chosen"))]) {
        el.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
                   { duration: 450, delay: 260, easing: "ease-out", fill: "backwards" });
      }
      flyer.animate(
        [{ transform: "translate(0,0) scale(1)" },
         { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${to.width / from.width})` }],
        { duration: 600, easing: EASE, fill: "forwards" }
      ).onfinish = () => {
        target.style.visibility = "";
        flyer.remove();
        src.style.visibility = "";
      };
    });
  }

  // ---- soft sounds, synthesised, no files; browsers allow them only after a touch ----
  let ac;
  function tone(fn) {
    try {
      ac ??= new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      fn(ac, ac.currentTime);
    } catch {}
  }
  function pluck(f0 = 660, f1 = 520) {   // a soft tap
    tone((ac, t) => {
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + .12);
      const g = ac.createGain(); g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.06, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .22);
    });
  }
  function chime() {            // two gentle notes with the heart
    tone((ac, t) => {
      for (const [f, at] of [[659.25, 0], [783.99, .16]]) {
        const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const g = ac.createGain(); g.gain.setValueAtTime(.0001, t + at);
        g.gain.exponentialRampToValueAtTime(.05, t + at + .02); g.gain.exponentialRampToValueAtTime(.0001, t + at + .7);
        o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + .75);
      }
    });
  }

  // ---- opening: runs on its own; a tap skips; reduced-motion skips ----
  const intro = document.getElementById("intro");
  document.body.classList.add("has-intro");
  function endIntro() {
    if (!intro.isConnected) return;
    intro.remove();
    document.body.classList.remove("has-intro");
  }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) endIntro();
  intro.addEventListener("click", endIntro);
  intro.addEventListener("animationend", (e) => { if (e.animationName === "intro-out") endIntro(); });

  document.getElementById("back").addEventListener("click", () => {
    pluck(520, 600);
    stepHow.hidden = true;
    stepWho.hidden = false;
    for (const a of stepWho.getAnimations()) a.cancel();
    if (!reduced()) stepWho.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: "ease-out" });
  });
</script>
